<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1c24">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Valle d'Aosta 8–15 agosto</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<style>
:root{
  --bg:#0f1c24; --card:#17282f; --card2:#1e343d; --line:#2b464f;
  --tx:#eaf2f5; --tx2:#a8c0c9; --tx3:#7d99a3;
  --ac:#5fc0d9; --gr:#6cc48a; --am:#e0a94a; --rd:#e07b6a;
  --sh:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{max-width:100%;overflow-x:clip}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);
  padding:0 0 88px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* header */
header{
  position:sticky;top:0;z-index:20;background:#0f1c24;
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 0 0;
}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px 8px;max-width:560px;margin:0 auto}
.htitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700}
.hnow{font-size:11px;color:var(--tx3)}
.days{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:560px;margin:0 auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{
  flex:none;min-width:46px;padding:6px 3px;border-radius:10px;text-align:center;
  background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s;
}
.dchip.on{background:var(--ac);border-color:var(--ac);color:#06222b}
.dchip.today:not(.on){border-color:var(--am)}
.dchip b{display:block;font-size:16px;line-height:1.1}
.dchip span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}

/* tabs */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:#17282f;
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;min-width:0;background:none;border:0;color:var(--tx3);font:inherit;font-size:9.8px;
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

section{display:none;padding-top:14px}
section.on{display:block}


h2.dh{font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 3px}
.dsub{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:12px}

/* weather */
.wx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:12px;border-left:3px solid var(--w)}
.wx .ic{font-size:26px;line-height:1}
.wx .t{flex:1;min-width:0}
.wx .t b{display:block;font-size:14px}
.wx .t span{font-size:12px;color:var(--tx2);display:block;margin-top:1px}
.wx .tp{text-align:right;font-size:19px;font-weight:700;white-space:nowrap}
.wx .tp small{display:block;font-size:9.5px;font-weight:400;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}

/* meta pills */
.dry{font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;margin-bottom:8px}
.dry.ok{background:rgba(108,196,138,.14);color:var(--gr)}
.dry.no{background:rgba(224,169,74,.14);color:var(--am)}
.hbar{margin-bottom:12px}
.hb{display:inline-block;width:calc(6.25% - 1px);height:16px;margin-right:1px;border-radius:2px;vertical-align:top;background:var(--card2)}
.hb.l1{background:rgba(224,169,74,.45)} .hb.l2{background:var(--am)} .hb.l3{background:var(--rd)}
.hlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--tx3);margin-top:3px;padding:0 1px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--tx2)}
.pill b{color:var(--tx);font-weight:600}

/* timeline */
.step{display:flex;gap:11px;padding-bottom:14px;position:relative}
.step::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;background:var(--bg);border:2px solid var(--ac);z-index:1}
.step.key .dot{background:var(--ac)}
.step.meal .dot{border-color:var(--gr);background:var(--gr)}
.sb{flex:1;min-width:0}
.hh{display:block;font-size:12px;font-weight:700;color:var(--ac);letter-spacing:.03em}
.step.meal .hh{color:var(--gr)}
.tx{display:block;font-size:14px;margin-top:3px;color:var(--tx);overflow-wrap:anywhere}
.tx b{font-weight:600}
.tx i{color:var(--tx2);font-style:italic}
.nav{
  display:inline-flex;align-items:center;gap:6px;margin-top:7px;
  background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ac);text-decoration:none;
}
.nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.tel{color:var(--gr);text-decoration:none;font-weight:600;border-bottom:1px dotted var(--gr)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.acts .nav{margin-top:0}
.mapbtn{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;
 font:inherit;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mapbtn.on{color:var(--ac);border-color:var(--ac)}
.mapbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.mapwrap{margin-top:8px}
.mapwrap iframe{width:100%;height:210px;border:0;border-radius:12px;display:block;background:var(--card2)}
.mapoff{background:var(--card2);border-radius:12px;padding:14px;font-size:12.5px;color:var(--tx3);text-align:center}
/* tavola */
.mrow{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;border-left:3px solid var(--line)}
.mrow.pick{border-left-color:var(--gr)}
.mhead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.mhead .mn{font-size:15px;font-weight:600}
.mtag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
 padding:2px 6px;border-radius:5px;background:rgba(108,196,138,.16);color:var(--gr)}
.mtag.alt{background:var(--card2);color:var(--tx3)}
.mstar{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--am);margin-left:auto}
.mstar small{font-weight:400;font-size:10.5px;color:var(--tx3);margin-left:2px}
.mstar.none{color:var(--tx3);font-weight:400;font-size:11px}
.mrow .md{font-size:13px;color:var(--tx2);line-height:1.4}
.mrow .mw{font-size:12px;color:var(--am);margin-top:5px}
.mlinks{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.mlinks a{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
 border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;text-decoration:none;color:var(--tx2)}
.mlinks a.g{color:var(--gr)} .mlinks a.b{color:var(--ac)}
.mday{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mday b{font-size:13px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
.mday span{font-size:12px;color:var(--tx3)}
/* spese */
.bal{display:flex;gap:9px;margin-bottom:14px}
.balc{flex:1;background:var(--card);border-radius:14px;padding:12px 13px;border-top:3px solid var(--bc)}
.balc .bn{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.balc .bv{font-size:20px;font-weight:700;margin-top:3px}
.balc .bs{font-size:11.5px;color:var(--tx3);margin-top:1px}
.settle{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;border-left:3px solid var(--gr)}
.settle .sv{font-size:22px;font-weight:700;color:var(--gr);margin:4px 0}
.settle .st{font-size:12.5px;color:var(--tx2)}
.frm{background:var(--card);border-radius:14px;padding:13px;margin-bottom:14px}
.frm input,.frm select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
 padding:11px 12px;color:var(--tx);font:inherit;font-size:15px;margin-bottom:8px;-webkit-appearance:none}
.frm input:focus,.frm select:focus{outline:none;border-color:var(--ac)}
.frm .r2{display:flex;gap:8px}
.frm .r2>*{flex:1}
.frm button{width:100%;background:var(--ac);color:#06222b;border:0;border-radius:9px;padding:12px;
 font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.exp{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.exp .ed{flex:1;min-width:0}
.exp .et{font-size:14px}
.exp .em{font-size:11.5px;color:var(--tx3);margin-top:1px}
.exp .ev{font-size:15px;font-weight:700;white-space:nowrap}
.exp .ex{background:none;border:0;color:var(--tx3);font-size:20px;padding:0 2px;cursor:pointer;line-height:1}
.tot{display:flex;justify-content:space-between;padding:13px 0;font-size:15px;font-weight:700;border-top:2px solid var(--line);margin-top:4px}

/* boxes */
.box{background:var(--card);border-radius:14px;padding:13px 14px;margin:12px 0;border-left:3px solid var(--tx3)}
.box.warn{border-left-color:var(--rd)}
.box.tip{border-left-color:var(--gr)}
.box.kit{border-left-color:var(--am)}
.box h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);margin-bottom:6px;font-weight:700}
.box.warn h4{color:var(--rd)} .box.tip h4{color:var(--gr)} .box.kit h4{color:var(--am)}
.box p{font-size:13.5px;color:var(--tx2)}
.box p b{color:var(--tx)}
.kitlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.kitlist span{background:var(--card2);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--tx)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:0}
.cbox{width:21px;height:21px;flex:none;border-radius:6px;border:2px solid var(--tx3);margin-top:1px;position:relative;transition:.15s}
.chk.done .cbox{background:var(--gr);border-color:var(--gr)}
.chk.done .cbox::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #06222b;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk .cl{flex:1;font-size:14px}
.chk.done .cl{color:var(--tx3);text-decoration:line-through}
.chk .cl small{display:block;color:var(--tx3);font-size:12px;margin-top:1px;text-decoration:none}

h3.blk{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ac);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3.blk:first-child{margin-top:4px}

.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.card .ct{font-size:15px;font-weight:600;margin-bottom:3px}
.card .cs{font-size:12.5px;color:var(--tx2)}
.card .cact{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.card .cact a{
  display:inline-flex;align-items:center;gap:5px;background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:7px 11px;
  font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ac);
}
.card .cact a.g{color:var(--gr)}
.card .cact svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

.wkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.wkrow:last-child{border:0}
.wkrow .wd{width:52px;flex:none;font-weight:700;font-size:12.5px}
.wkrow .wi{font-size:18px;width:24px;text-align:center;flex:none}
.wkrow .wt{flex:1;color:var(--tx2);font-size:12.5px}
.wkrow .wv{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.wv.g{background:rgba(108,196,138,.16);color:var(--gr)}
.wv.a{background:rgba(224,169,74,.16);color:var(--am)}
.wv.r{background:rgba(224,123,106,.16);color:var(--rd)}

.foot{text-align:center;color:var(--tx3);font-size:11.5px;padding:22px 0 4px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="htop">
    <span class="htitle">Valle d'Aosta 2026</span>
    <span class="hnow" id="now"></span>
  </div>
  <div class="days" id="days"></div>
</header>

<div class="wrap">
  <section id="s-oggi" class="on"></section>
  <section id="s-meteo"></section>
  <section id="s-tavola"></section>
  <section id="s-info"></section>
  <section id="s-spese"></section>
  <section id="s-kit"></section>
</div>

<nav class="tabs">
  <button class="on" data-s="oggi"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Giorno</button>
  <button data-s="meteo"><svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.4 1.5A3.3 3.3 0 0 1 17.5 16z"/><path d="M8.5 19l-1 2.5M12.5 19l-1 2.5M16.5 19l-1 2.5"/></svg>Meteo</button>
  <button data-s="tavola"><svg viewBox="0 0 24 24"><path d="M6 3v7a2.5 2.5 0 0 0 5 0V3M8.5 10v11"/><path d="M17.5 21V13c2 0 2.8-1.4 2.8-4.4C20.3 5.2 19.3 3 17.5 3s-2.8 2.2-2.8 5.6c0 3 .8 4.4 2.8 4.4z"/></svg>Tavola</button>
  <button data-s="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Utile</button>
  <button data-s="spese"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.6 5 3 5 1.1 5 3-2.2 3-5 3-5-1.1-5-3"/></svg>Spese</button>
  <button data-s="kit"><svg viewBox="0 0 24 24"><path d="M6 8h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M9 8V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V8"/></svg>Valigia</button>
</nav>

/* ---------- meteo che si aggiorna da solo ---------- */
const WXPOS=[  // una coordinata per giorno: dove siete davvero
 [45.808,7.593],[45.845,7.625],[45.518,7.203],[45.808,7.593],
 [45.919,7.637],[45.737,7.320],[45.605,7.746],[45.808,7.593]];
const WXLAB=["Antey","Chamois","Pont","Antey","Lago Blu","Aosta","Bard","Antey"];
// pagine 3B Meteo verificate (Antey non esiste sul loro sito: si usa Valtournenche, stessa valle)
const WX3B=["valtournenche","chamois","valsavarenche","valtournenche","breuilcervinia","aosta","bard","valtournenche"];

function wmo(c){
 if(c===0)              return {i:"☀️",b:"Sereno"};
 if(c===1||c===2)       return {i:"⛅",b:"Poco nuvoloso"};
 if(c===3)              return {i:"☁️",b:"Nuvoloso"};
 if(c===45||c===48)     return {i:"🌫️",b:"Nebbia"};
 if(c>=51&&c<=57)       return {i:"🌦️",b:"Pioviggine"};
 if(c>=61&&c<=67)       return {i:"🌧️",b:"Pioggia"};
 if(c>=71&&c<=77)       return {i:"🌨️",b:"Neve"};
 if(c>=80&&c<=82)       return {i:"🌦️",b:"Rovesci"};
 if(c>=95)              return {i:"⛈️",b:"Temporali"};
 return {i:"☁️",b:"Variabile"};
}
function wxColor(mm,pr){
 if(mm>=5) return "var(--rd)";
 if(mm>=1||pr>=55) return "var(--am)";
 return "var(--gr)";
}

const WXURL=(()=>{
 const la=WXPOS.map(p=>p[0]).join(','), lo=WXPOS.map(p=>p[1]).join(',');
 return `https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}`
  +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max`
  +`&hourly=precipitation,precipitation_probability`
  +`&timezone=Europe%2FRome&start_date=2026-08-08&end_date=2026-08-15`;
})();

// dalle ore 7 alle 22: quando piove davvero
function hourly(loc,date){
 if(!loc.hourly||!loc.hourly.time) return null;
 const out=[];
 loc.hourly.time.forEach((t,i)=>{
   if(t.slice(0,10)!==date) return;
   const h=+t.slice(11,13);
   if(h<7||h>22) return;
   out.push({h:h, mm:loc.hourly.precipitation[i]||0, p:loc.hourly.precipitation_probability[i]||0});
 });
 return out.length?out:null;
}
function dryWindow(hh){
 if(!hh) return null;
 const wet=hh.filter(x=>x.mm>=0.2);
 if(!wet.length) return {txt:"Asciutto tutto il giorno",ok:true};
 const first=wet[0].h, last=wet[wet.length-1].h;
 if(first>=18) return {txt:`Asciutto fino alle ${first}:00 — la pioggia arriva di sera`,ok:true};
 if(last<=10)  return {txt:`Piove solo fino alle ${last+1}:00, poi migliora`,ok:true};
 return {txt:`Pioggia dalle ${first}:00 alle ${last+1}:00`,ok:first>=15};
}
function applyWx(data,when){
 const arr = Array.isArray(data) ? data : [data];
 P.forEach((d,i)=>{
   const loc = arr[i]; if(!loc||!loc.daily) return;
   const k = loc.daily.time.indexOf(d.d); if(k<0) return;
   const w = wmo(loc.daily.weather_code[k]);
   const mx = Math.round(loc.daily.temperature_2m_max[k]);
   const mn = Math.round(loc.daily.temperature_2m_min[k]);
   const mm = loc.daily.precipitation_sum[k];
   const pr = loc.daily.precipitation_probability_max[k];
   d.w = {i:w.i, b:`${w.b}, ${mm.toFixed(1).replace('.',',')} mm`,
          s:`Probabilità di pioggia ${pr}%`,
          t:`${mn}°/${mx}°`, l:WXLAB[i], c:wxColor(mm,pr)};
   const hh=hourly(loc,d.d);
   d.hh=hh; d.dry=dryWindow(hh);
   d.wk = [w.i, `${w.b} · ${mn}–${mx}° · ${mm.toFixed(1).replace('.',',')} mm · ${pr}%`,
           mm>=5?"Al coperto":(mm>=1||pr>=55?"Attenzione":"Buono"),
           mm>=5?"r":(mm>=1||pr>=55?"a":"g")];
 });
 WXSTAMP = when;
 day(); renderMeteo();
}

let WXSTAMP = null;

function renderMeteo(){
 const fresh = WXSTAMP
   ? `Aggiornato ${new Date(WXSTAMP).toLocaleString('it-IT',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}`
   : 'Dati del 7 agosto — non ancora aggiornati';
 el('#s-meteo').innerHTML=`<h3 class="blk">La settimana</h3>
  ${P.map((d,i)=>{const w=d.wk||WEEK[i];return `<div class="wkrow"><span class="wd">${d.dow} ${d.n}</span>
    <span class="wi">${w[0]}</span><span class="wt">${w[1]}</span>
    <span class="wv ${w[3]||w[4]}">${w[2]}</span></div>`}).join('')}
  <div class="box ${WXSTAMP?'tip':''}"><h4>${WXSTAMP?'Previsioni fresche':'Previsioni da aggiornare'}</h4>
   <p>${fresh}. L'app le riscarica da sola a ogni apertura con rete, per la località dove siete quel giorno — non per il fondovalle.</p>
   <div style="margin-top:10px"><button class="mapbtn" id="wxnow">${MAPSVG} Aggiorna adesso</button></div></div>
  <div class="box"><h4>Verifica su un'altra fonte</h4>
   <p>Questi numeri vengono dal modello <b>best-match</b> di open-meteo. Sull'entità della pioggia i modelli divergono parecchio: per domenica a Chamois vanno da 1,4 mm (ECMWF) a 14,1 mm (GFS). Sulla <b>collocazione oraria</b> invece concordano, ed è quella che decide se la gita si fa. Confrontate con 3B Meteo quando qualcosa non torna.</p>
   <div class="mlinks" style="margin-top:10px">
     ${P.map((d,i)=>`<a class="b" href="https://www.3bmeteo.com/meteo/${WX3B[i]}" target="_blank" rel="noopener">${d.dow} ${d.n} · ${WXLAB[i]}</a>`).join('')}
   </div></div>
  <div class="box tip"><h4>Come leggere la barra oraria</h4><p>Nella scheda del giorno, sotto il meteo, ogni tacca è un'ora dalle 7 alle 22. <b>Grigia</b>: asciutto. <b>Ambra chiara</b>: probabile ma senza accumulo. <b>Ambra</b>: pioggia debole. <b>Rossa</b>: sopra il millimetro. Il totale giornaliero da solo inganna — 33 mm che cadono alle 20 non toccano una gita che finisce alle 15.</p></div>`;
 const b=el('#wxnow'); if(b) b.onclick=()=>loadWx(true);
}

function loadWx(force){
 const cached = localStorage.getItem('wx');
 if(cached && !force){
   try{const c=JSON.parse(cached); applyWx(c.d,c.t);}catch(e){}
 }
 if(!navigator.onLine){ if(!cached) renderMeteo(); return; }
 const b=el('#wxnow'); if(b) b.textContent='Aggiorno…';
 fetch(WXURL).then(r=>r.json()).then(j=>{
   const t=Date.now();
   localStorage.setItem('wx',JSON.stringify({d:j,t:t}));
   applyWx(j,t);
 }).catch(()=>{ renderMeteo(); });
}

/* render statico sostituito da renderMeteo() */
loadWx(false);

const NUCLEI={G:{n:"Giovanni, Tiziana e Bianca",s:"Noi",teste:3,c:"var(--ac)"},
              P:{n:"Paola e Gabriele",s:"Paola",teste:2,c:"var(--am)"}};
const SPLITS={meta:{n:"Metà e metà",G:.5,P:.5},
              quote:{n:"A quote — 3 e 2",G:.6,P:.4},
              adulti:{n:"Solo adulti — 2 e 1",G:2/3,P:1/3},
              solaG:{n:"Solo nostra",G:1,P:0},
              solaP:{n:"Solo di Paola",G:0,P:1}};

function loadSp(){try{return JSON.parse(localStorage.getItem('spese')||'[]')}catch(e){return[]}}
function saveSp(a){localStorage.setItem('spese',JSON.stringify(a))}
function eur(v){return v.toFixed(2).replace('.',',')+' €'}

function renderSpese(){
  const sp=loadSp();
  let tot=0, pagG=0, pagP=0, dovG=0, dovP=0;
  sp.forEach(e=>{
    tot+=e.v;
    if(e.by==='G') pagG+=e.v; else pagP+=e.v;
    const q=SPLITS[e.sp]||SPLITS.meta;
    dovG+=e.v*q.G; dovP+=e.v*q.P;
  });
  const saldo = pagG - dovG;   // >0: Paola deve a noi
  const chi = saldo>=0 ? `<b>Paola</b> deve a noi` : `<b>Noi</b> dobbiamo a Paola`;

  el('#s-spese').innerHTML=`<h3 class="blk">Spese del viaggio</h3>
   <div class="settle">
     <div class="st">${Math.abs(saldo)<0.01?'Siete in pari':chi}</div>
     <div class="sv">${Math.abs(saldo)<0.01?'—':eur(Math.abs(saldo))}</div>
     <div class="st">su ${eur(tot)} spesi in totale</div>
   </div>
   <div class="bal">
     <div class="balc" style="--bc:var(--ac)"><div class="bn">Noi</div>
       <div class="bv">${eur(pagG)}</div><div class="bs">anticipati · quota ${eur(dovG)}</div></div>
     <div class="balc" style="--bc:var(--am)"><div class="bn">Paola</div>
       <div class="bv">${eur(pagP)}</div><div class="bs">anticipati · quota ${eur(dovP)}</div></div>
   </div>
   <div class="frm">
     <input id="sp-t" placeholder="Cosa — es. spesa Conad, funivia, cena">
     <div class="r2">
       <input id="sp-v" type="number" inputmode="decimal" step="0.01" placeholder="€">
       <select id="sp-by">${Object.keys(NUCLEI).map(k=>`<option value="${k}">Paga ${NUCLEI[k].s}</option>`).join('')}</select>
     </div>
     <select id="sp-sp">${Object.keys(SPLITS).map(k=>`<option value="${k}">${SPLITS[k].n}</option>`).join('')}</select>
     <button id="sp-add">Aggiungi spesa</button>
   </div>
   ${sp.length?`<h3 class="blk">Movimenti</h3>${sp.map((e,i)=>`
     <div class="exp"><div class="ed"><div class="et">${e.t}</div>
       <div class="em">${NUCLEI[e.by].s} · ${(SPLITS[e.sp]||SPLITS.meta).n}${e.d?' · '+e.d:''}</div></div>
       <div class="ev">${eur(e.v)}</div><button class="ex" data-i="${i}">×</button></div>`).join('')}
     <div class="tot"><span>Totale</span><span>${eur(tot)}</span></div>
     <div class="frm" style="margin-top:14px"><button id="sp-share">Copia riepilogo per Paola</button></div>`
    :'<div class="box"><h4>Ancora nessuna spesa</h4><p>Aggiungi la prima qui sopra: funivia, spesa al Conad, pranzo, benzina.</p></div>'}
   <div class="box kit"><h4>Come si divide</h4><p><b>Metà e metà</b> per le spese di casa e auto.<br><b>A quote, 3 a 2</b>, in proporzione alle teste: spesa alimentare e pranzi.<br><b>Solo adulti, 2 a 1</b> — voi due contro Paola: cene al ristorante, impianti e ingressi dove Bianca non paga e Gabriele è ridotto.<br><b>Solo nostra</b> o <b>solo di Paola</b> per quello che riguarda un nucleo soltanto.</p></div>
   <div class="box warn"><h4>I dati stanno su questo telefono</h4><p>Non si sincronizzano con quello di Paola. Registra tutto tu, e usa <b>Copia riepilogo</b> per mandarle il conto su WhatsApp quando volete pareggiare.</p></div>`;

  const add=el('#sp-add');
  if(add) add.onclick=()=>{
    const t=el('#sp-t').value.trim(), v=parseFloat((el('#sp-v').value||'').replace(',','.'));
    if(!t||!(v>0)){el('#sp-t').focus();return;}
    const a=loadSp();
    a.unshift({t:t,v:v,by:el('#sp-by').value,sp:el('#sp-sp').value,
      d:new Date().toLocaleDateString('it-IT',{day:'numeric',month:'short'})});
    saveSp(a); renderSpese();
  };
  document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{
    const a=loadSp(); a.splice(+b.dataset.i,1); saveSp(a); renderSpese();
  });
  const sh=el('#sp-share');
  if(sh) sh.onclick=()=>{
    const txt='Spese Valle d\'Aosta\n\n'+sp.map(e=>`${e.d||''} ${e.t}: ${eur(e.v)} (${NUCLEI[e.by].s}, ${(SPLITS[e.sp]||SPLITS.meta).n})`).join('\n')
      +`\n\nTotale ${eur(tot)}\nAnticipati noi ${eur(pagG)}, Paola ${eur(pagP)}\n`
      +(Math.abs(saldo)<0.01?'Siamo in pari':(saldo>0?`Paola deve a noi ${eur(saldo)}`:`Noi dobbiamo a Paola ${eur(-saldo)}`));

    else if(navigator.clipboard){navigator.clipboard.writeText(txt);sh.textContent='Copiato';setTimeout(()=>sh.textContent='Copia riepilogo per Paola',1500);}
  };
}

 <h3 class="blk">Come funziona il programma</h3>
 <div class="box"><h4>Le regole che lo tengono in piedi</h4><p>Uscita mai prima delle <b>9:30</b> · tutti a nanna alle <b>22:00</b> · massimo <b>1h30 a tavola</b>, pranzi e cene · un solo pasto fuori al giorno, quasi sempre a pranzo · le cene fuori solo in locali a meno di 5 minuti da casa.</p></div>
 <div class="box"><h4>Versione dell'app</h4>

el('#s-kit').innerHTML=`<h3 class="blk">Valigia e accessori</h3>
 <div class="box"><h4>Spunta man mano</h4><p>Le spunte restano salvate su questo telefono, anche chiudendo l'app.</p></div>
 <div class="box tip"><h4>C'è la lavatrice</h4><p>Le quantità coprono cinque giorni, non otto. Il momento giusto per il bucato è <b>mercoledì pomeriggio</b>: rientrate alle 15:45 e restate in agriturismo mentre piove, così asciuga in tempo.</p></div>

 ${KIT.map(g=>`<h3 class="blk">${g[0]}</h3>${g.slice(1).map(it=>{
   const id='k_'+g[0].replace(/\W/g,'')+'_'+it.replace(/\W/g,'');

document.querySelectorAll('.chk').forEach(c=>{
  if(localStorage.getItem(c.dataset.k)==='1')c.classList.add('done');
  c.onclick=()=>{c.classList.toggle('done');
    localStorage.setItem(c.dataset.k,c.classList.contains('done')?'1':'0')};
});

(function(){
  const b=el('#forceupd'); if(!b) return;
  b.onclick=async ev=>{
    ev.preventDefault();
    b.textContent='Aggiorno…';
    try{
      if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
      if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r=>r.unregister())); }
    }catch(e){}
    location.reload(true);
  };
})();

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');el('#s-'+b.dataset.s).classList.add('on');
  window.scrollTo(0,0);
});

(function(){
  const t=new Date(),n=today(),d=P.find(x=>x.d===n);
  el('#now').textContent=d?`Oggi · giorno ${P.indexOf(d)+1} di 8`
    :(n<P[0].d?`Si parte l'8 agosto`:`Viaggio concluso`);
})();

chips();day();
