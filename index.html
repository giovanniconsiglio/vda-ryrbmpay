<title>Valle d'Aosta 8–15 agosto</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<style>
:root{
  --bg:#0f1c24; --card:#17282f; --card2:#1e343d; --line:#2b464f;
  --tx:#eaf2f5; --tx2:#a8c0c9; --tx3:#7d99a3;
  --ac:#5fc0d9; --gr:#6cc48a; --am:#e0a94a; --rd:#e07b6a;
  --sh:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{max-width:100%;overflow-x:clip}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);
  padding:0 0 88px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* header */
header{
  position:sticky;top:0;z-index:20;background:#0f1c24;
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 0 0;
}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px 8px;max-width:560px;margin:0 auto}
.htitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700}
.hnow{font-size:11px;color:var(--tx3)}
.days{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:560px;margin:0 auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{
  flex:none;min-width:46px;padding:6px 3px;border-radius:10px;text-align:center;
  background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s;
}
.dchip.on{background:var(--ac);border-color:var(--ac);color:#06222b}
.dchip.today:not(.on){border-color:var(--am)}
.dchip b{display:block;font-size:16px;line-height:1.1}
.dchip span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}

/* tabs */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:#17282f;
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;min-width:0;background:none;border:0;color:var(--tx3);font:inherit;font-size:10.5px;
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

section{display:none;padding-top:14px}
section.on{display:block}


h2.dh{font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 3px}
.dsub{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:12px}

/* weather */
.wx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:12px;border-left:3px solid var(--w)}
.wx .ic{font-size:26px;line-height:1}
.wx .t{flex:1;min-width:0}
.wx .t b{display:block;font-size:14px}
.wx .t span{font-size:12px;color:var(--tx2);display:block;margin-top:1px}
.wx .tp{text-align:right;font-size:19px;font-weight:700;white-space:nowrap}
.wx .tp small{display:block;font-size:9.5px;font-weight:400;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}

/* meta pills */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--tx2)}
.pill b{color:var(--tx);font-weight:600}

/* timeline */
.step{display:flex;gap:11px;padding-bottom:14px;position:relative}
.step::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;background:var(--bg);border:2px solid var(--ac);z-index:1}
.step.key .dot{background:var(--ac)}
.step.meal .dot{border-color:var(--gr);background:var(--gr)}
.sb{flex:1;min-width:0}
.hh{display:block;font-size:12px;font-weight:700;color:var(--ac);letter-spacing:.03em}
.step.meal .hh{color:var(--gr)}
.tx{display:block;font-size:14px;margin-top:3px;color:var(--tx);overflow-wrap:anywhere}
.tx b{font-weight:600}
.tx i{color:var(--tx2);font-style:italic}
.nav{
  display:inline-flex;align-items:center;gap:6px;margin-top:7px;
  background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ac);text-decoration:none;
}
.nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.tel{color:var(--gr);text-decoration:none;font-weight:600;border-bottom:1px dotted var(--gr)}

/* boxes */
.box{background:var(--card);border-radius:14px;padding:13px 14px;margin:12px 0;border-left:3px solid var(--tx3)}
.box.warn{border-left-color:var(--rd)}
.box.tip{border-left-color:var(--gr)}
.box.kit{border-left-color:var(--am)}
.box h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);margin-bottom:6px;font-weight:700}
.box.warn h4{color:var(--rd)} .box.tip h4{color:var(--gr)} .box.kit h4{color:var(--am)}
.box p{font-size:13.5px;color:var(--tx2)}
.box p b{color:var(--tx)}
.kitlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.kitlist span{background:var(--card2);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--tx)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:0}
.cbox{width:21px;height:21px;flex:none;border-radius:6px;border:2px solid var(--tx3);margin-top:1px;position:relative;transition:.15s}
.chk.done .cbox{background:var(--gr);border-color:var(--gr)}
.chk.done .cbox::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #06222b;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk .cl{flex:1;font-size:14px}
.chk.done .cl{color:var(--tx3);text-decoration:line-through}
.chk .cl small{display:block;color:var(--tx3);font-size:12px;margin-top:1px;text-decoration:none}

h3.blk{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ac);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3.blk:first-child{margin-top:4px}

.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.card .ct{font-size:15px;font-weight:600;margin-bottom:3px}
.card .cs{font-size:12.5px;color:var(--tx2)}
.card .cact{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.card .cact a{
  display:inline-flex;align-items:center;gap:5px;background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:7px 11px;
  font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ac);
}
.card .cact a.g{color:var(--gr)}
.card .cact svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

.wkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.wkrow:last-child{border:0}
.wkrow .wd{width:52px;flex:none;font-weight:700;font-size:12.5px}
.wkrow .wi{font-size:18px;width:24px;text-align:center;flex:none}
.wkrow .wt{flex:1;color:var(--tx2);font-size:12.5px}
.wkrow .wv{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.wv.g{background:rgba(108,196,138,.16);color:var(--gr)}
.wv.a{background:rgba(224,169,74,.16);color:var(--am)}
.wv.r{background:rgba(224,123,106,.16);color:var(--rd)}

.foot{text-align:center;color:var(--tx3);font-size:11.5px;padding:22px 0 4px;line-height:1.6}
</style>
</head>

const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
let idx=Math.max(0,P.findIndex(d=>d.d===today()));if(idx<0)idx=0;

function chips(){
  el('#days').innerHTML=P.map((d,i)=>
   `<div class="dchip${i===idx?' on':''}${d.d===today()?' today':''}" data-i="${i}"><b>${d.n}</b><span>${d.dow}</span></div>`).join('');
  document.querySelectorAll('.dchip').forEach(c=>c.onclick=()=>{idx=+c.dataset.i;chips();day();window.scrollTo(0,0)});
}

  const d=P[idx];
  el('#s-oggi').innerHTML=`
   <h2 class="dh">${d.t}</h2><div class="dsub">${d.sub}</div>
   <div class="wx" style="--w:${d.w.c}"><span class="ic">${d.w.i}</span>
     <span class="t"><b>${d.w.b}</b><span>${d.w.s}</span></span>
     <span class="tp">${d.w.t}<small>${d.w.l}</small></span></div>

   ${d.s.map(s=>`<div class="step${s.k?' key':''}${s.m?' meal':''}"><span class="dot"></span><span class="sb">

}

document.querySelectorAll('.chk').forEach(c=>{

  c.onclick=()=>{c.classList.toggle('done');
    localStorage.setItem(c.dataset.k,c.classList.contains('done')?'1':'0')};
});

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');el('#s-'+b.dataset.s).classList.add('on');
  window.scrollTo(0,0);
});
